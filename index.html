<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Anota Treino — Biblioteca v2</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#1f1f1f;color:#eee;font-size:13px}
 h1{font-size:15px;margin:0 0 8px} p{color:#aaa;margin:0 0 12px;line-height:1.4}
 .warn{background:#3a2a14;color:#f1d29a;border-radius:8px;padding:10px;margin-bottom:12px;line-height:1.4}
 button{width:100%;padding:12px;border:0;border-radius:999px;background:#e5e5e5;color:#171717;font-weight:700;font-size:14px;cursor:pointer}
 button:disabled{opacity:.45;cursor:default}
 #status{margin-top:12px;white-space:pre-wrap;color:#ccc;max-height:190px;overflow:auto;font-size:12px}
 progress{width:100%;margin-top:10px}
</style></head>
<body>
 <h1>Anota Treino — Biblioteca v2</h1>
 <p>Reconstrói a biblioteca com auto layout e componentes aninhados: 44 páginas, cores e tipografias da biblioteca.</p>
 <div class="warn" id="warn">Verificando o arquivo…</div>
 <button id="go" disabled>Reconstruir biblioteca</button>
 <progress id="bar" max="100" value="0"></progress>
 <div id="status">Pronto.</div>
<script>
 const go=document.getElementById('go'), st=document.getElementById('status'), bar=document.getElementById('bar'), warn=document.getElementById('warn');
 go.addEventListener('click',()=>{ go.disabled=true; go.textContent='Reconstruindo…'; st.textContent='Iniciando…'; parent.postMessage({type:'generate'},'*'); });
 window.addEventListener('message',ev=>{
   const m=ev.data; if(!m) return;
   if(m.type==='check'){
     if(!m.ok){ warn.textContent=m.why; go.disabled=true; return; }
     warn.textContent = m.isTarget
       ? 'Arquivo "'+m.name+'": as páginas e componentes atuais serão apagados e refeitos. Uma versão de segurança é salva antes no histórico.'
       : 'Arquivo "'+m.name+'" está vazio: a biblioteca será criada aqui como teste.';
     go.disabled=false; return;
   }
   if(m.type!=='progress') return;
   if(m.total){bar.max=m.total; bar.value=m.done;}
   st.textContent=m.msg+'\n'+st.textContent;
   if(m.finished){
     go.textContent=m.failed?'Falhou — ver status':'Concluído';
     if(m.errors&&m.errors.length) st.textContent='Erros ('+m.errors.length+'):\n'+m.errors.join('\n')+'\n\n'+st.textContent;
     window.__result=m;
   }
 });
 parent.postMessage({type:'check'},'*');
</script>
</body></html>
